name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Target-specific cache key (wasm build)
          key: wasm32-wasip1

      - name: Build plugin
        run: cargo build --release --target wasm32-wasip1

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/wasm32-wasip1/release/zellij-auto-name.wasm \
            "dist/zellij-auto-name-${GITHUB_REF_NAME}.wasm"
          # Stable name for install scripts
          cp target/wasm32-wasip1/release/zellij-auto-name.wasm \
            dist/zellij-auto-name.wasm
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zellij-auto-name.wasm
            dist/zellij-auto-name-${{ github.ref_name }}.wasm
          generate_release_notes: true
          fail_on_unmatched_files: true
